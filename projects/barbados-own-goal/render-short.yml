name: Render Animated Short (Three.js + Remotion)

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "Video folder inside code/src/videos/"
        required: true
        default: "02_barbados_own_goal"
        type: string
      quality:
        description: "Render quality (Preview = 540x960 fast, Video = 1080x1920 Full HD)"
        required: true
        default: "Preview"
        type: choice
        options:
          - Preview
          - Video
      run_gates:
        description: "Run logic & framing gate checks (06_CHECKS) before rendering"
        required: true
        default: true
        type: boolean

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "code/package-lock.json"

      - name: Install headless Chrome dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2 libpango-1.0-0 libcairo2

      - name: Install dependencies
        working-directory: code
        run: npm install --no-audit --no-fund

      - name: Run logic & framing gates (06_CHECKS)
        if: ${{ inputs.run_gates }}
        working-directory: code
        env:
          VIDEO: ${{ inputs.video_id }}
        run: npx tsx --tsconfig src/videos/${{ inputs.video_id }}/tsconfig.json src/engine/check/gates.ts

      - name: Render Three.js + Remotion MP4
        working-directory: code
        env:
          VIDEO: ${{ inputs.video_id }}
        run: |
          mkdir -p out
          SUF="preview_540p"
          if [ "${{ inputs.quality }}" = "Video" ]; then SUF="full_1080p"; fi
          OUT="out/${{ inputs.video_id }}_${SUF}.mp4"
          npx remotion render src/index.ts "${{ inputs.quality }}" "$OUT" --codec h264 --gl=swangle --concurrency=2
          ls -lh "$OUT"

      - name: Upload rendered MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.video_id }}-${{ inputs.quality }}-mp4
          path: code/out/*.mp4
          retention-days: 14
